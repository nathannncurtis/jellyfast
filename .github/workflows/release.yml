name: release

# Pushing a tag like v0.2.0 builds, signs, notarizes and publishes Jellyfast.
# The tag must equal the version in Cargo.toml, because scripts/bundle.sh writes
# CFBundleShortVersionString and CFBundleVersion from Cargo.toml.
# A manual run builds the same files and uploads them as a workflow artifact;
# tick "publish" to also create the tag and release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to build, e.g. v0.2.0 (must match Cargo.toml)
        required: true
        type: string
      publish:
        description: Create the tag and GitHub release (otherwise only upload a workflow artifact)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'nathannncurtis/jellyfast'
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: Require the signing secrets
        env:
          P12: ${{ secrets.MAC_DEVID_P12 || secrets.APPLE_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVID_P12 && secrets.MAC_DEVID_P12_PASSWORD || secrets.APPLE_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.MAC_DEVID_IDENTITY || secrets.APPLE_SIGN_IDENTITY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing MAC_DEVID_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing MAC_DEVID_P12_PASSWORD"
          [ -n "$IDENTITY" ] || missing="$missing MAC_DEVID_IDENTITY"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Release builds are signed and notarized, and these repository secrets are not set:$missing. Add them under Settings, Secrets and variables, Actions. Nothing was built or published."
            exit 1
          fi
          case "$IDENTITY" in
            "Developer ID Application:"*) ;;
            *) echo "::error::MAC_DEVID_IDENTITY must start with 'Developer ID Application:' (got a different kind of identity)."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against Cargo.toml
        run: |
          case "$VERSION_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION_TAG' is not a version tag like v1.2.3."; exit 1 ;;
          esac
          cargo_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${VERSION_TAG#v}" != "$cargo_version" ]; then
            echo "::error::Tag $VERSION_TAG does not match version $cargo_version in Cargo.toml. Bump Cargo.toml (and Cargo.lock), merge it, then tag that commit."
            exit 1
          fi
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import the signing certificate
        id: cert
        uses: ./.github/actions/import-cert
        with:
          p12: ${{ secrets.MAC_DEVID_P12 || secrets.APPLE_CERT_P12 }}
          password: ${{ secrets.MAC_DEVID_P12 && secrets.MAC_DEVID_P12_PASSWORD || secrets.APPLE_CERT_PASSWORD }}
          identity: ${{ secrets.MAC_DEVID_IDENTITY || secrets.APPLE_SIGN_IDENTITY }}
      - name: Build and sign the app
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          [ -n "$SIGN_IDENTITY" ] && [ -n "$KEYCHAIN" ] || { echo "::error::The signing certificate was not imported; refusing to build an ad hoc release."; exit 1; }
          scripts/bundle.sh --universal --out dist
      - name: Notarize and staple the app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: scripts/notarize.sh dist/*.app
      - name: Package
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: |
          mkdir release
          app=$(ls -d dist/*.app)
          name=Jellyfast-$VERSION_TAG-macos-universal
          ditto -c -k --keepParent "$app" "release/$name.zip"
          # The app inside the disk image already carries its stapled notarization ticket.
          mkdir dmg_staging
          ditto "$app" "dmg_staging/$(basename "$app")"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname Jellyfast -srcfolder dmg_staging -ov -format UDZO "release/$name.dmg"
          codesign --force --sign "$SIGN_IDENTITY" --keychain "$KEYCHAIN" --timestamp "release/$name.dmg"
      - name: Remove the signing keychain
        if: always() && steps.cert.outputs.keychain != ''
        run: security delete-keychain "${{ steps.cert.outputs.keychain }}"
      - name: Check the bundle
        run: |
          app=$(ls -d dist/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=2 "$app" 2>&1 | grep -E 'Identifier|TeamIdentifier|Authority|flags|Signature'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          lipo -archs "$app/Contents/MacOS/"*
          short=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          echo "CFBundleShortVersionString=$short CFBundleVersion=$build"
          [ "$short" = "${VERSION_TAG#v}" ] && [ "$build" = "${VERSION_TAG#v}" ]
          codesign --verify --strict --verbose=2 release/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellyfast-release
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: github.repository == 'nathannncurtis/jellyfast' && (github.event_name == 'push' || github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION_TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jellyfast-release
          path: dist
      - name: Every asset is present
        run: |
          for ext in zip dmg; do
            test -s "dist/Jellyfast-$VERSION_TAG-macos-universal.$ext" || { echo "::error::missing the .$ext"; exit 1; }
          done
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.zip *.dmg > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Release notes
        run: |
          # Commit subjects since the previous version tag. The sed keeps a stray mention in a subject from pinging anyone.
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$(git rev-parse HEAD)^" 2>/dev/null || true)
          range=HEAD
          [ -z "$prev" ] || range="$prev..HEAD"
          {
            echo "## Jellyfast $VERSION_TAG"
            echo
            echo "Universal macOS app (Apple silicon and Intel, macOS 14 or newer), signed with a Developer ID certificate and notarized by Apple."
            echo
            echo "- Jellyfast-$VERSION_TAG-macos-universal.dmg: open it and drag Jellyfast to Applications."
            echo "- Jellyfast-$VERSION_TAG-macos-universal.zip: the same app, zipped."
            echo "- SHA256SUMS.txt: check with \`shasum -a 256 -c SHA256SUMS.txt\`."
            echo
            echo "### Changes"
            echo
            if [ -n "$prev" ]; then echo "Since $prev:"; echo; fi
            git log --no-merges --format='- %s (%h)' "$range" | sed 's/@/ at /g'
            echo
            echo "### SHA-256"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: Jellyfast ${{ env.VERSION_TAG }}
          files: dist/*
          body_path: ${{ runner.temp }}/notes.md
          fail_on_unmatched_files: true
          generate_release_notes: false
