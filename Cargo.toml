[package]
name = "jellyfast"
version = "0.1.0"
edition = "2021"

[dependencies]
objc2 = "0.6.5"                       # Objective-C runtime and message-send bindings (maintained successor to objc 0.2)
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
security-framework = "3.7"           # Keychain (thin binding to Security.framework)

[profile.release]
lto = true
strip = true
panic = "abort"
opt-level = "z"                      # small binary; change to 3 if you want max speed

[dev-dependencies]
# Test-only: mock HTTP server + #[tokio::test]
tokio = { version = "1", features = ["macros", "net", "io-util", "rt-multi-thread"] }
